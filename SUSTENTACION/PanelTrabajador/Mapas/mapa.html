<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>ARTEMUSA | Selector de ubicación</title>

		<link rel="stylesheet"
			  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
		<link rel="stylesheet" href="css/style.css" />
	</head>

	<body>

		<div class="layout">

			<!-- ═══════════════════════════════════════
             SIDEBAR IZQUIERDO (búsqueda + info)
             ═══════════════════════════════════════ -->
			<aside class="sidebar">

				<!-- BUSCADOR -->
				<section class="search-panel">

					<div class="title">
						<span>Buscar destino</span>
						<span class="subtitle">● Mapa interactivo</span>
					</div>

					<div class="tabs">
						<button class="tab active"
								data-mode="localidad"
								onclick="cambiarModo('localidad')">
							Localidad
						</button>

						<button class="tab"
								data-mode="coordenadas"
								onclick="cambiarModo('coordenadas')">
							Coordenadas
						</button>

						<button class="tab"
								data-mode="direccion"
								onclick="cambiarModo('direccion')">
							Dirección
						</button>
					</div>

					<div class="search-content">

						<!-- 1. LOCALIDAD -->
						<div class="group active" id="localidad">
							<input id="inputLocalidad"
								   placeholder="Ej. Yunguyo, Puno, Perú" />
							<button class="search" onclick="buscarLocalidad()">
								Buscar localidad
							</button>
						</div>

						<!-- 2. COORDENADAS -->
						<div class="group" id="coordenadas">
							<div class="coord-grid">
								<input id="inputLat" placeholder="-15.49" inputmode="decimal" />
								<input id="inputLon" placeholder="-70.13" inputmode="decimal" />
							</div>
							<button class="search" onclick="buscarCoordenadas()">
								Localizar coordenadas
							</button>
						</div>

						<!-- 3. DIRECCIÓN -->
						<div class="group" id="direccion">
							<input id="inputDireccion"
								   placeholder="Ej. Plaza de Armas de Puno" />
							<button class="search" onclick="buscarDireccion()">
								Buscar dirección
							</button>
						</div>

					</div>

					<div id="status">Mapa preparado.</div>

				</section>

				<!-- INFORMACIÓN DEL DESTINO -->
				<section class="details">

					<div class="details-heading">
						● Información del destino
					</div>

					<div class="detail-row">
						<span class="detail-label">Lugar</span>
						<div class="detail-value" id="datoLugar">Sin seleccionar</div>
					</div>

					<div class="detail-row">
						<span class="detail-label">Dirección</span>
						<div class="detail-value" id="datoDireccion">Pendiente</div>
					</div>

					<div class="detail-row">
						<span class="detail-label">Localidad</span>
						<div class="detail-value" id="datoLocalidad">Pendiente</div>
					</div>

					<div class="detail-row">
						<span class="detail-label">Coordenadas</span>
						<div class="detail-value" id="datoCoordenadas">Pendiente</div>
					</div>

					<!-- RUTA -->
					<div class="route-info">
						<div class="route-title">🚗 Ruta de traslado</div>
						<div class="route-grid">
							<div class="route-stat">
								<span>Distancia</span>
								<strong id="distanciaRuta">-- km</strong>
							</div>
							<div class="route-stat">
								<span>Tiempo</span>
								<strong id="tiempoRuta">-- min</strong>
							</div>
						</div>
						<div id="estadoRuta">
							Selecciona un destino para calcular la ruta.
						</div>
					</div>

				</section>

			</aside>

			<!-- ═══════════════════════════════════════
             MAPA (ocupa todo el espacio restante)
             ═══════════════════════════════════════ -->
			<div class="map-wrapper">
				<div id="map"></div>
				<div class="map-hint">
					Haz clic para seleccionar un destino
				</div>
			</div>

		</div>

		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
		<script src="js/script.js"></script>

	</body>
</html>
